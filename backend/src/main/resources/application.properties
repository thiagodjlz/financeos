quarkus.application.name=financeos-backend
quarkus.http.port=8080
quarkus.http.root-path=/api

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=16

# URL/credenciais explicitas apenas em dev e prod. O perfil test nao define
# nenhuma delas de proposito: isso faz o Quarkus Dev Services subir um Postgres
# efemero (Testcontainers) so para os testes, em vez de aplicar migrations no
# banco de dev do docker-compose como efeito colateral de rodar `mvnw test`.
# POSTGRES_PASSWORD nao tem valor padrao de proposito: sem a variavel a aplicacao
# se recusa a subir, em vez de cair numa senha conhecida versionada no repositorio.
%dev,prod.quarkus.datasource.username=${POSTGRES_USER:financeos}
%dev,prod.quarkus.datasource.password=${POSTGRES_PASSWORD}
%dev,prod.quarkus.datasource.jdbc.url=${JDBC_URL:jdbc:postgresql://localhost:5432/financeos}
%test.quarkus.datasource.devservices.db-name=financeos

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.path=/docs
# Build-time: a imagem de producao e construida com -Dquarkus.swagger-ui.always-include=false
# (ARG SWAGGER_UI no Dockerfile), entao /api/docs e /api/openapi nem existem la.
quarkus.swagger-ui.always-include=true

# Por padrao as chaves vem do classpath (o par gerado localmente, gitignored). Em producao
# JWT_*_KEY_LOCATION aponta para um par proprio montado no container: a imagem pode ter sido
# construida a partir de um clone limpo (sem .pem) ou com o .pem de uma maquina de desenvolvimento.
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:publicKey.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:https://financeos.local/issuer}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:privateKey.pem}

# "production" liga as travas de ambiente exposto (ProductionBootstrap): exige chave RSA propria,
# exige um administrador vindo do ambiente e desativa as contas cujo hash foi publicado no repositorio.
financeos.deployment=${FINANCEOS_DEPLOYMENT:local}
financeos.admin.email=${FINANCEOS_ADMIN_EMAIL:}
financeos.admin.password=${FINANCEOS_ADMIN_PASSWORD:}
