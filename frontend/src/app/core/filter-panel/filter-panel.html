<div class="list-toolbar">
  <button
    type="button"
    class="ghost-button filter-toggle"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="panelId"
    (click)="toggle()"
  >
    {{ toggleLabel() }}
  </button>
  <ng-content select="[toolbarAction]" />
</div>

@if (chips().length) {
  <ul class="filter-chips" aria-label="Filtros aplicados">
    @for (chip of chips(); track chip.key) {
      <li class="filter-chip">
        <span>{{ chip.label }}</span>
        <button
          type="button"
          class="filter-chip-remove"
          [attr.aria-label]="'Remover filtro ' + chip.label"
          title="Remover filtro"
          (click)="remove.emit(chip.key)"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </li>
    }
  </ul>
}

@if (open()) {
  <div class="filter-panel" [id]="panelId">
    <div class="filter-fields">
      <ng-content />
    </div>
    <div class="filter-actions">
      <button type="button" class="ghost-button" [disabled]="!canClear()" (click)="clear.emit()">Limpar filtros</button>
    </div>
  </div>
}
