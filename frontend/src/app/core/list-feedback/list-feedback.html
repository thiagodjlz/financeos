@if (loading()) {
  <p class="loading-state"><span class="sr-only">Carregando...</span></p>
} @else if (error()) {
  <div class="list-state">
    <span class="state-icon error" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 18.5h10a4 4 0 0 0 .6-8 6 6 0 0 0-11.5 1.3A3.4 3.4 0 0 0 7 18.5z"></path>
        <path d="M4 4l16 16"></path>
      </svg>
    </span>
    <p class="load-error" role="alert">{{ error() }}</p>
  </div>
} @else if (empty()) {
  @if (filtered()) {
    <div class="list-state filtered-empty">
      <span class="state-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="11" cy="11" r="6.5"></circle>
          <path d="M20 20l-4.2-4.2"></path>
        </svg>
      </span>
      <p>Nenhum registro encontrado.</p>
      @if (canClear()) {
        <button type="button" class="ghost-button" (click)="clear.emit()">Limpar filtros</button>
      }
    </div>
  } @else {
    <ng-content />
  }
}
