@if (loading()) {
  <div class="loading-state skeleton-list">
    <span class="sr-only">Carregando...</span>
    @for (row of skeletonRows; track row) {
      <span class="skeleton-row" aria-hidden="true">
        <span class="skeleton-block"></span>
        <span class="skeleton-line"></span>
        <span class="skeleton-line short"></span>
      </span>
    }
  </div>
} @else if (error()) {
  <div class="list-state load-failed">
    <p class="load-error" role="alert">{{ error() }}</p>
    @if (retryable()) {
      <button type="button" class="retry-button" (click)="retry.emit()">Tentar novamente</button>
    }
  </div>
} @else if (empty()) {
  @if (filtered()) {
    <div class="list-state filtered-empty">
      <span class="state-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="11" cy="11" r="6.5"></circle>
          <path d="M20 20l-4.2-4.2"></path>
        </svg>
      </span>
      <p>Nenhum registro encontrado.</p>
      @if (canClear()) {
        <button type="button" class="ghost-button" (click)="clear.emit()">Limpar filtros</button>
      }
    </div>
  } @else {
    <ng-content />
  }
}
