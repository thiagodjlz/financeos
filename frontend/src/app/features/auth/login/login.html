<div class="auth-shell">
  <section class="auth-card">
    <form class="auth-form" (ngSubmit)="submit()">
      <div class="brand-block">
        <div class="mark" aria-hidden="true">F</div>
        <div class="brand-text">
          <h1>Entrar no {{ appName }}</h1>
          <p>Controle financeiro</p>
        </div>
      </div>

      <label>
        E-mail
        <span class="input-affix">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3.5" y="5.5" width="17" height="13" rx="2.5"></rect>
            <path d="M4 7l8 6 8-6"></path>
          </svg>
          <input type="email" name="email" [(ngModel)]="form.email" required autocomplete="email" />
        </span>
      </label>
      <label>
        Senha
        <span class="input-affix password-field">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="10.5" width="14" height="10" rx="2.5"></rect>
            <path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"></path>
          </svg>
          <input
            [type]="passwordVisible() ? 'text' : 'password'"
            name="password"
            [(ngModel)]="form.password"
            required
            autocomplete="current-password"
          />
          <button
            type="button"
            class="icon-button"
            [attr.aria-label]="passwordVisible() ? 'Ocultar senha' : 'Mostrar senha'"
            [attr.title]="passwordVisible() ? 'Ocultar senha' : 'Mostrar senha'"
            [attr.aria-pressed]="passwordVisible()"
            (click)="togglePassword()"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12s-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"></path>
              <circle cx="12" cy="12" r="3"></circle>
              <path *ngIf="passwordVisible()" d="M4 4l16 16"></path>
            </svg>
          </button>
        </span>
      </label>

      <button class="primary-button" type="submit" [disabled]="saving()">Entrar</button>
    </form>
  </section>

  <footer class="app-footer">{{ appName }} &middot; v{{ appVersion }}</footer>
</div>
