<h2 class="page-title">Categorias</h2>

<section class="panel table-panel">
  <div class="panel-heading">
    <h3>Últimos registros</h3>
    <span>{{ list.totalItems() }}</span>
  </div>

  <app-filter-panel
    [activeCount]="list.activeCount()"
    [chips]="chips()"
    [canClear]="list.differsFromDefault()"
    (remove)="list.remove($event)"
    (clear)="list.clear()"
  >
    <button
      toolbarAction
      *ngIf="authService.can('CATEGORIES', 'CREATE')"
      type="button"
      class="primary-button"
      (click)="create()"
    >
      Incluir
    </button>

    <label>
      Nome
      <input name="filterName" [(ngModel)]="list.filters.name" (change)="list.apply()" (keydown.enter)="list.apply()" />
    </label>
    <label>
      Tipo
      <select name="filterType" [(ngModel)]="list.filters.type" (change)="list.apply()">
        <option value="">Todos</option>
        <option value="EXPENSE">Despesa</option>
        <option value="INCOME">Receita</option>
      </select>
    </label>
    <label>
      Situação
      <select name="filterActive" [(ngModel)]="list.filters.active" (change)="list.apply()">
        <option value="true">Ativos</option>
        <option value="false">Inativos</option>
        <option value="">Todos</option>
      </select>
    </label>
  </app-filter-panel>

  <div class="table-wrap" [attr.aria-busy]="list.loading()">
    <table class="fixed-layout" *ngIf="list.items().length">
      <colgroup>
        <col />
        <col class="col-type" />
        <col class="col-situation" />
        <col class="col-actions" />
      </colgroup>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Tipo</th>
          <th>Situação</th>
          <th><span class="sr-only">Ações</span></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let category of list.items()">
          <td data-label="Nome">
            <div class="category-name">
              <span class="category-dot" *ngIf="category.color" [style.background]="category.color"></span>
              {{ category.name }}
            </div>
          </td>
          <td data-label="Tipo">{{ category.type === 'EXPENSE' ? 'Despesa' : 'Receita' }}</td>
          <td data-label="Situação">
            <span class="status-pill" [class.pill-income]="category.active" [class.pill-neutral]="!category.active">
              {{ category.active ? 'Ativo' : 'Inativo' }}
            </span>
          </td>
          <td class="row-actions">
            <button
              *ngIf="authService.can('CATEGORIES', 'EDIT')"
              type="button"
              class="ghost-button"
              (click)="edit(category)"
            >
              Editar
            </button>
            <button
              *ngIf="authService.can('CATEGORIES', 'DELETE')"
              type="button"
              class="icon-button"
              aria-label="Excluir"
              title="Excluir"
              (click)="requestDelete(category)"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M4 7h16" />
                <path d="M9 7V4.5h6V7" />
                <path d="M6 7l1 12.5h10L18 7" />
                <path d="M10 11v5" />
                <path d="M14 11v5" />
              </svg>
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <app-list-feedback
      [loading]="list.loading()"
      [error]="list.loadError()"
      [empty]="!list.items().length"
      [filtered]="list.activeCount() > 0"
      [canClear]="list.differsFromDefault()"
      (clear)="list.clear()"
    >
      <p class="empty-state">Nenhuma categoria cadastrada</p>
    </app-list-feedback>
  </div>

  <app-pagination [page]="list.page()" [totalPages]="list.totalPages()" (pageChange)="list.goTo($event)" />
</section>

<app-confirm-dialog
  *ngIf="deletingCategory() as category"
  [message]="deleteMessage(category)"
  cancelLabel="Cancelar"
  confirmLabel="Excluir categoria"
  (cancel)="cancelDelete()"
  (confirm)="confirmDelete()"
/>
