<header class="page-header form-header">
  <div class="page-heading">
    <button type="button" class="back-link" aria-label="Voltar para Categorias" title="Voltar para Categorias" (click)="requestCancel()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 6l-6 6 6 6"></path>
      </svg>
      <span class="back-link-text">Categorias</span>
    </button>
    <h1 class="page-title">{{ id ? 'Editar categoria' : 'Nova categoria' }}</h1>
    <p class="page-subtitle">{{ id ? 'Altere os dados da categoria' : 'Cadastre uma categoria de receita ou despesa' }}</p>
  </div>
</header>

<div class="form-page" [attr.aria-busy]="loading()">
  <p class="loading-state" *ngIf="loading()"><span class="sr-only">Carregando...</span></p>
  <p class="load-error" role="alert" *ngIf="!loading() && loadError()">{{ loadError() }}</p>

  <form class="panel form-card" *ngIf="!loading() && !loadError()" #categoryForm (ngSubmit)="save()">
    <div class="form-card-body form-grid">
      <label>
        Nome
        <input
          name="name"
          [(ngModel)]="form.name"
          required
          [class.invalid]="fieldErrors.invalid('name')"
          (input)="fieldErrors.clear('name')"
        />
        <small class="field-error" *ngIf="fieldErrors.invalid('name')">{{ fieldErrors.message('name') }}</small>
      </label>
      <label>
        Tipo
        <select
          name="type"
          [(ngModel)]="form.type"
          [class.invalid]="fieldErrors.invalid('type')"
          (change)="fieldErrors.clear('type')"
        >
          <option value="EXPENSE">Despesa</option>
          <option value="INCOME">Receita</option>
        </select>
        <small class="field-error" *ngIf="fieldErrors.invalid('type')">{{ fieldErrors.message('type') }}</small>
      </label>
      <label>
        Cor
        <input
          type="color"
          name="color"
          [(ngModel)]="form.color"
          [class.invalid]="fieldErrors.invalid('color')"
          (input)="fieldErrors.clear('color')"
        />
        <small class="field-error" *ngIf="fieldErrors.invalid('color')">{{ fieldErrors.message('color') }}</small>
      </label>
      <label>
        Situação
        <select
          name="active"
          [(ngModel)]="form.active"
          [class.invalid]="fieldErrors.invalid('active')"
          (change)="fieldErrors.clear('active')"
        >
          <option [ngValue]="true">Ativo</option>
          <option [ngValue]="false">Inativo</option>
        </select>
        <small class="field-error" *ngIf="fieldErrors.invalid('active')">{{ fieldErrors.message('active') }}</small>
      </label>
    </div>

    <div class="form-card-footer form-actions">
      <button class="ghost-button" type="button" (click)="requestCancel()">Cancelar</button>
      <button class="primary-button" type="submit" [disabled]="saving()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12.5l4.5 4.5L19 7.5"></path>
        </svg>
        <span>Salvar categoria</span>
      </button>
    </div>
  </form>
</div>

<app-confirm-dialog
  *ngIf="confirmingExit()"
  message="Deseja sair sem salvar?"
  cancelLabel="Continuar editando"
  confirmLabel="Sair sem salvar"
  (cancel)="keepEditing()"
  (confirm)="confirmExit()"
/>
