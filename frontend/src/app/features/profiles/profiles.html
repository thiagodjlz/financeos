<header class="page-header">
  <div class="page-heading">
    <h1 class="page-title">Perfis</h1>
    <p class="page-subtitle">Defina o que cada perfil pode ver e fazer</p>
  </div>
  <div class="page-actions" *ngIf="authService.can('PROFILES', 'CREATE')">
    <button type="button" class="primary-button" (click)="create()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14"></path>
      </svg>
      <span>Novo perfil</span>
    </button>
  </div>
</header>

<section class="panel list-panel">
  <app-filter-panel [list]="list" [chips]="chips()" [hasFields]="false">
    <label filterSearch class="input-affix search-field">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5"></circle>
        <path d="M20 20l-4.2-4.2"></path>
      </svg>
      <input
        name="filterName"
        placeholder="Buscar por nome"
        aria-label="Buscar por nome"
        [(ngModel)]="list.filters.name"
        (change)="list.apply()"
        (keydown.enter)="list.apply()"
      />
    </label>
  </app-filter-panel>

  <div class="table-wrap" [attr.aria-busy]="list.loading()">
    <table class="fixed-layout" *ngIf="list.items().length">
      <colgroup>
        <col />
        <col class="col-actions" />
      </colgroup>
      <thead>
        <tr>
          <th scope="col">Nome</th>
          <th scope="col"><span class="sr-only">Ações</span></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let profile of list.items()">
          <td class="name-cell" data-label="Nome">{{ profile.name }}</td>
          <td class="row-actions">
            <span class="row-actions-inner">
              <button
                *ngIf="authService.can('PROFILES', 'EDIT')"
                type="button"
                class="icon-button"
                aria-label="Editar perfil"
                title="Editar perfil"
                (click)="edit(profile)"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"></path>
                  <path d="M13.5 6.5l4 4"></path>
                </svg>
              </button>
              <button
                *ngIf="authService.can('PROFILES', 'DELETE')"
                type="button"
                class="icon-button danger"
                aria-label="Excluir perfil"
                title="Excluir perfil"
                [disabled]="saving()"
                (click)="remove(profile)"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M4 7h16"></path>
                  <path d="M9 7V4.5h6V7"></path>
                  <path d="M6 7l1 12.5h10L18 7"></path>
                  <path d="M10 11v5"></path>
                  <path d="M14 11v5"></path>
                </svg>
              </button>
            </span>
          </td>
        </tr>
      </tbody>
    </table>

    <app-list-feedback
      [loading]="list.loading()"
      [error]="list.loadError()"
      [empty]="!list.items().length"
      [filtered]="list.activeCount() > 0"
      [canClear]="list.differsFromDefault()"
      (clear)="list.clear()"
    >
      <div class="list-state">
        <strong>Nenhum perfil cadastrado</strong>
        <p class="empty-state">Os perfis que você cadastrar aparecem aqui.</p>
      </div>
    </app-list-feedback>
  </div>

  <app-pagination
    [page]="list.page()"
    [totalPages]="list.totalPages()"
    [totalItems]="list.totalItems()"
    (pageChange)="list.goTo($event)"
  />
</section>
