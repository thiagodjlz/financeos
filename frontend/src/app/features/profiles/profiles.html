<h2 class="page-title">Perfis</h2>

<section class="profiles-grid">
  <form class="panel form-panel" *ngIf="authService.can('PROFILES', 'CREATE') || editingId()" (ngSubmit)="save()">
    <div class="panel-heading">
      <h3>{{ editingId() ? 'Editar perfil' : 'Novo perfil' }}</h3>
    </div>
    <label class="name-field">
      Nome
      <input name="name" [(ngModel)]="name" required />
    </label>

    <div class="table-wrap">
      <table class="permissions-table">
        <thead>
          <tr>
            <th>Tela</th>
            <th class="perm-col">Ver</th>
            <th class="perm-col">Incluir</th>
            <th class="perm-col">Alterar</th>
            <th class="perm-col">Excluir</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let permission of permissions">
            <td class="screen-cell">{{ screenLabel(permission.screen) }}</td>
            <td class="checkbox-cell">
              <label class="perm-switch">
                <input type="checkbox" [(ngModel)]="permission.canView" [name]="permission.screen + '-view'" />
                <span class="perm-switch-label">Ver {{ screenLabel(permission.screen) }}</span>
              </label>
            </td>
            <td class="checkbox-cell">
              <label class="perm-switch">
                <input type="checkbox" [(ngModel)]="permission.canCreate" [name]="permission.screen + '-create'" />
                <span class="perm-switch-label">Incluir em {{ screenLabel(permission.screen) }}</span>
              </label>
            </td>
            <td class="checkbox-cell">
              <label class="perm-switch">
                <input type="checkbox" [(ngModel)]="permission.canEdit" [name]="permission.screen + '-edit'" />
                <span class="perm-switch-label">Alterar em {{ screenLabel(permission.screen) }}</span>
              </label>
            </td>
            <td class="checkbox-cell">
              <label class="perm-switch">
                <input type="checkbox" [(ngModel)]="permission.canDelete" [name]="permission.screen + '-delete'" />
                <span class="perm-switch-label">Excluir em {{ screenLabel(permission.screen) }}</span>
              </label>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="two-cols form-actions">
      <button class="primary-button" type="submit" [disabled]="saving()">Salvar</button>
      <button class="ghost-button" type="button" (click)="cancel()">Cancelar</button>
    </div>
  </form>

  <section class="panel table-panel">
    <div class="panel-heading">
      <h3>Perfis</h3>
      <span>{{ profiles().length }}</span>
    </div>
    <div class="compact-list">
      <div class="list-row" *ngFor="let profile of profiles()">
        <div>
          <strong>{{ profile.name }}</strong>
        </div>
        <div class="row-actions">
          <button *ngIf="authService.can('PROFILES', 'EDIT')" type="button" class="ghost-button" (click)="edit(profile)">
            Editar
          </button>
          <button *ngIf="authService.can('PROFILES', 'DELETE')" type="button" class="ghost-button" (click)="remove(profile)">
            Excluir
          </button>
        </div>
      </div>
      <p class="empty-state" *ngIf="!profiles().length">Nenhum perfil cadastrado</p>
    </div>
  </section>
</section>
