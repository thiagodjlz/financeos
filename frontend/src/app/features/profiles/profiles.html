<h2 class="page-title">Perfis</h2>

<section class="panel table-panel">
  <div class="panel-heading">
    <h3>Perfis</h3>
    <span>{{ list.totalItems() }}</span>
  </div>

  <app-filter-panel
    [activeCount]="list.activeCount()"
    [chips]="chips()"
    [canClear]="list.differsFromDefault()"
    (remove)="list.remove($event)"
    (clear)="list.clear()"
  >
    <button
      toolbarAction
      *ngIf="authService.can('PROFILES', 'CREATE')"
      type="button"
      class="primary-button"
      (click)="create()"
    >
      Incluir
    </button>

    <label>
      Nome
      <input name="filterName" [(ngModel)]="list.filters.name" (change)="list.apply()" (keydown.enter)="list.apply()" />
    </label>
  </app-filter-panel>

  <div class="table-wrap" [attr.aria-busy]="list.loading()">
    <table class="fixed-layout" *ngIf="list.items().length">
      <colgroup>
        <col />
        <col class="col-actions" />
      </colgroup>
      <thead>
        <tr>
          <th>Nome</th>
          <th><span class="sr-only">Ações</span></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let profile of list.items()">
          <td data-label="Nome">{{ profile.name }}</td>
          <td class="row-actions">
            <button
              *ngIf="authService.can('PROFILES', 'EDIT')"
              type="button"
              class="ghost-button"
              (click)="edit(profile)"
            >
              Editar
            </button>
            <button
              *ngIf="authService.can('PROFILES', 'DELETE')"
              type="button"
              class="ghost-button"
              [disabled]="saving()"
              (click)="remove(profile)"
            >
              Excluir
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <app-list-feedback
      [loading]="list.loading()"
      [error]="list.loadError()"
      [empty]="!list.items().length"
      [filtered]="list.activeCount() > 0"
      [canClear]="list.differsFromDefault()"
      (clear)="list.clear()"
    >
      <p class="empty-state">Nenhum perfil cadastrado</p>
    </app-list-feedback>
  </div>

  <app-pagination [page]="list.page()" [totalPages]="list.totalPages()" (pageChange)="list.goTo($event)" />
</section>
