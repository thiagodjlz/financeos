<header class="page-header form-header">
  <div class="page-heading">
    <button type="button" class="back-link" aria-label="Voltar para Lançamentos" title="Voltar para Lançamentos" (click)="requestCancel()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 6l-6 6 6 6"></path>
      </svg>
      <span class="back-link-text">Lançamentos</span>
    </button>
    <h1 class="page-title">{{ id ? 'Editar lançamento' : 'Novo lançamento' }}</h1>
    <p class="page-subtitle">{{ id ? 'Altere os dados do lançamento' : 'Registre uma receita ou despesa' }}</p>
  </div>
</header>

<div class="form-page" [attr.aria-busy]="loading()">
  <p class="loading-state" *ngIf="loading()"><span class="sr-only">Carregando...</span></p>
  <p class="load-error" role="alert" *ngIf="!loading() && loadError()">{{ loadError() }}</p>

  <form class="panel form-card" *ngIf="!loading() && !loadError()" #transactionForm (ngSubmit)="save()">
    <div class="form-card-body">
      <fieldset class="type-choice">
        <legend>Tipo</legend>
        <div class="type-choice-options">
          <label>
            <input
              type="radio"
              name="type"
              value="EXPENSE"
              [(ngModel)]="form.type"
              (ngModelChange)="onTypeChange()"
              (change)="fieldErrors.clear('type')"
            />
            <span class="choice">
              <span class="choice-icon expense" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 5v14M5.5 12.5L12 19l6.5-6.5"></path>
                </svg>
              </span>
              Despesa
            </span>
          </label>
          <label>
            <input
              type="radio"
              name="type"
              value="INCOME"
              [(ngModel)]="form.type"
              (ngModelChange)="onTypeChange()"
              (change)="fieldErrors.clear('type')"
            />
            <span class="choice">
              <span class="choice-icon income" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"></path>
                </svg>
              </span>
              Receita
            </span>
          </label>
        </div>
        <small class="field-error" *ngIf="fieldErrors.invalid('type')">{{ fieldErrors.message('type') }}</small>
      </fieldset>

      <label>
        Valor
        <span class="input-affix amount-field">
          <span class="affix-text">R$</span>
          <input
            type="text"
            name="amount"
            inputmode="decimal"
            autocomplete="off"
            placeholder="0,00"
            [(ngModel)]="form.amount"
            required
            [class.invalid]="fieldErrors.invalid('amount')"
            (input)="fieldErrors.clear('amount')"
          />
        </span>
        <small class="field-error" *ngIf="fieldErrors.invalid('amount')">{{ fieldErrors.message('amount') }}</small>
      </label>

      <label>
        Descrição
        <input
          name="description"
          placeholder="Ex.: Compras do mês"
          [(ngModel)]="form.description"
          maxlength="255"
          required
          [class.invalid]="fieldErrors.invalid('description')"
          (input)="fieldErrors.clear('description')"
        />
        <span class="field-meta">
          <small class="field-error" *ngIf="fieldErrors.invalid('description')">
            {{ fieldErrors.message('description') }}
          </small>
          <span class="field-counter">{{ form.description.length }}/255</span>
        </span>
      </label>

      <label *ngIf="categoryUnavailable()">
        Categoria
        <span class="field-notice">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="10.5" width="14" height="10" rx="2.5"></rect>
            <path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"></path>
          </svg>
          <span>Seu perfil não tem permissão para ver Categorias, por isso não é possível escolher a categoria.</span>
        </span>
        <small class="field-error" *ngIf="fieldErrors.invalid('categoryId')">
          {{ fieldErrors.message('categoryId') }}
        </small>
      </label>
      <label *ngIf="!categoryUnavailable()">
        Categoria
        <span class="category-select" [class.with-dot]="selectedCategoryColor()">
          <span
            class="category-dot"
            *ngIf="selectedCategoryColor() as color"
            [style.background]="color"
            aria-hidden="true"
          ></span>
          <select
            name="categoryId"
            [(ngModel)]="form.categoryId"
            (ngModelChange)="onCategoryIdChange()"
            required
            [class.invalid]="fieldErrors.invalid('categoryId')"
            (change)="fieldErrors.clear('categoryId')"
          >
            <option value="">Selecione</option>
            <option *ngIf="preselectedInactiveCategory() as inactiveCategory" [value]="inactiveCategory.id">
              {{ inactiveCategory.name }} (Inativo)
            </option>
            <option *ngFor="let category of categories()" [value]="category.id">{{ category.name }}</option>
          </select>
        </span>
        <small class="field-error" *ngIf="fieldErrors.invalid('categoryId')">
          {{ fieldErrors.message('categoryId') }}
        </small>
      </label>

      <div class="two-cols">
        <div class="date-field">
          <label>
            Data
            <input
              type="date"
              name="transactionDate"
              [(ngModel)]="form.transactionDate"
              required
              [class.invalid]="fieldErrors.invalid('transactionDate')"
              (input)="fieldErrors.clear('transactionDate')"
            />
            <small class="field-error" *ngIf="fieldErrors.invalid('transactionDate')">
              {{ fieldErrors.message('transactionDate') }}
            </small>
          </label>
          <div class="date-shortcuts" role="group" aria-label="Atalhos de data">
            <button type="button" class="date-shortcut" [attr.aria-pressed]="isDaysAgo(0)" (click)="chooseDaysAgo(0)">
              Hoje
            </button>
            <button type="button" class="date-shortcut" [attr.aria-pressed]="isDaysAgo(1)" (click)="chooseDaysAgo(1)">
              Ontem
            </button>
          </div>
        </div>
        <fieldset class="segmented" *ngIf="form.type !== 'INCOME'">
          <legend>Status</legend>
          <div class="segmented-track">
            <label>
              <input
                type="radio"
                name="status"
                value="PENDING"
                [(ngModel)]="form.status"
                (change)="fieldErrors.clear('status')"
              />
              <span class="segment">Pendente</span>
            </label>
            <label>
              <input
                type="radio"
                name="status"
                value="PAID"
                [(ngModel)]="form.status"
                (change)="fieldErrors.clear('status')"
              />
              <span class="segment">Pago</span>
            </label>
          </div>
          <small class="field-error" *ngIf="fieldErrors.invalid('status')">{{ fieldErrors.message('status') }}</small>
        </fieldset>
      </div>
    </div>

    <div class="form-card-footer form-actions">
      <button class="ghost-button" type="button" (click)="requestCancel()">Cancelar</button>
      <button class="primary-button" type="submit" [disabled]="saving()">
        <svg *ngIf="!saving()" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12.5l4.5 4.5L19 7.5"></path>
        </svg>
        <span>{{ saving() ? 'Salvando…' : 'Salvar lançamento' }}</span>
      </button>
    </div>
  </form>
</div>

<app-confirm-dialog
  *ngIf="confirmingExit()"
  message="Deseja sair sem salvar?"
  cancelLabel="Continuar editando"
  confirmLabel="Sair sem salvar"
  (cancel)="keepEditing()"
  (confirm)="confirmExit()"
/>
