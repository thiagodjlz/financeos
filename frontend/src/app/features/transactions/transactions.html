<h2 class="page-title">Lançamentos</h2>

<section class="panel table-panel">
  <div class="panel-heading">
    <h3>Últimos lançamentos</h3>
    <span>{{ list.totalItems() }}</span>
  </div>

  <app-filter-panel
    [activeCount]="list.activeCount()"
    [chips]="chips()"
    [canClear]="list.differsFromDefault()"
    (remove)="list.remove($event)"
    (clear)="list.clear()"
  >
    <button
      toolbarAction
      *ngIf="authService.can('TRANSACTIONS', 'CREATE')"
      type="button"
      class="primary-button"
      (click)="create()"
    >
      Incluir
    </button>

    <label>
      Descrição
      <input
        name="filterDescription"
        [(ngModel)]="list.filters.description"
        (change)="list.apply()"
        (keydown.enter)="list.apply()"
      />
    </label>
    <label>
      Tipo
      <select name="filterType" [(ngModel)]="list.filters.type" (change)="onFilterTypeChange()">
        <option value="">Todos</option>
        <option value="EXPENSE">Despesa</option>
        <option value="INCOME">Receita</option>
      </select>
    </label>
    <label *ngIf="canViewCategories()">
      Categoria
      <select name="filterCategoryId" [(ngModel)]="list.filters.categoryId" (change)="list.apply()">
        <option value="">Todas</option>
        <option *ngFor="let category of filterCategories()" [value]="category.id">
          {{ categoryOptionLabel(category) }}
        </option>
      </select>
    </label>
    <label>
      Status
      <select name="filterStatus" [(ngModel)]="list.filters.status" (change)="list.apply()">
        <option value="">Todos</option>
        <option value="PENDING">Pendente</option>
        <option value="PAID">Pago</option>
        <option value="CANCELED">Cancelado</option>
      </select>
    </label>
    <label>
      Data de
      <input type="date" name="filterStartDate" [(ngModel)]="list.filters.startDate" (change)="list.apply()" />
    </label>
    <label>
      Data até
      <input type="date" name="filterEndDate" [(ngModel)]="list.filters.endDate" (change)="list.apply()" />
    </label>
  </app-filter-panel>

  <div class="table-wrap" [attr.aria-busy]="list.loading()">
    <table class="fixed-layout" *ngIf="list.items().length">
      <colgroup>
        <col class="col-date" />
        <col />
        <col class="col-category" />
        <col class="col-status" />
        <col class="col-amount" />
        <col class="col-actions" />
      </colgroup>
      <thead>
        <tr>
          <th>Data</th>
          <th>Descrição</th>
          <th>Categoria</th>
          <th>Status</th>
          <th class="amount-cell">Valor</th>
          <th><span class="sr-only">Ações</span></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let transaction of list.items()">
          <td data-label="Data">{{ transaction.transactionDate }}</td>
          <td data-label="Descrição">{{ transaction.description }}</td>
          <td data-label="Categoria">{{ categoryName(transaction) }}</td>
          <td data-label="Status">
            <span [class]="statusPillClass(transaction.status)">{{ statusLabel(transaction.status) }}</span>
          </td>
          <td
            data-label="Valor"
            class="amount-cell"
            [class.income]="transaction.type === 'INCOME'"
            [class.expense]="transaction.type === 'EXPENSE'"
          >
            {{ signedMoney(transaction) }}
          </td>
          <td class="row-actions">
            <button
              *ngIf="authService.can('TRANSACTIONS', 'EDIT')"
              type="button"
              class="ghost-button"
              (click)="edit(transaction)"
            >
              Editar
            </button>
            <button
              *ngIf="authService.can('TRANSACTIONS', 'DELETE')"
              type="button"
              class="danger-button"
              [disabled]="saving()"
              (click)="cancelTransaction(transaction)"
            >
              Cancelar
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <app-list-feedback
      [loading]="list.loading()"
      [error]="list.loadError()"
      [empty]="!list.items().length"
      [filtered]="list.activeCount() > 0"
      [canClear]="list.differsFromDefault()"
      (clear)="list.clear()"
    >
      <p class="empty-state">Sem lançamentos cadastrados</p>
    </app-list-feedback>
  </div>

  <app-pagination [page]="list.page()" [totalPages]="list.totalPages()" (pageChange)="list.goTo($event)" />
</section>
