<h2 class="page-title">Usuários</h2>

<section class="panel table-panel">
  <div class="panel-heading">
    <h3>Usuários</h3>
    <span>{{ list.totalItems() }}</span>
  </div>

  <app-filter-panel
    [activeCount]="list.activeCount()"
    [chips]="chips()"
    [canClear]="list.differsFromDefault()"
    (remove)="list.remove($event)"
    (clear)="list.clear()"
  >
    <button
      toolbarAction
      *ngIf="authService.can('USERS', 'CREATE')"
      type="button"
      class="primary-button"
      (click)="create()"
    >
      Incluir
    </button>

    <label>
      Nome
      <input name="filterName" [(ngModel)]="list.filters.name" (change)="list.apply()" (keydown.enter)="list.apply()" />
    </label>
    <label>
      E-mail
      <input
        name="filterEmail"
        [(ngModel)]="list.filters.email"
        (change)="list.apply()"
        (keydown.enter)="list.apply()"
      />
    </label>
    <label>
      Perfil
      <select name="filterProfileId" [(ngModel)]="list.filters.profileId" (change)="list.apply()">
        <option value="">Todos</option>
        <option *ngFor="let profile of profiles()" [value]="profile.id">{{ profile.name }}</option>
      </select>
    </label>
    <label>
      Situação
      <select name="filterActive" [(ngModel)]="list.filters.active" (change)="list.apply()">
        <option value="true">Ativos</option>
        <option value="false">Inativos</option>
        <option value="">Todos</option>
      </select>
    </label>
  </app-filter-panel>

  <div class="table-wrap" [attr.aria-busy]="list.loading()">
    <table class="fixed-layout" *ngIf="list.items().length">
      <colgroup>
        <col />
        <col />
        <col class="col-profile" />
        <col class="col-status" />
        <col class="col-actions" />
      </colgroup>
      <thead>
        <tr>
          <th>Nome</th>
          <th>E-mail</th>
          <th>Perfil</th>
          <th>Status</th>
          <th><span class="sr-only">Ações</span></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of list.items()">
          <td data-label="Nome">{{ user.name }}</td>
          <td data-label="E-mail">{{ user.email }}</td>
          <td data-label="Perfil">{{ profileName(user.profileId) }}</td>
          <td data-label="Status">
            <span class="status-pill" [class.pill-income]="user.active" [class.pill-neutral]="!user.active">
              {{ user.active ? 'Ativo' : 'Inativo' }}
            </span>
          </td>
          <td class="row-actions">
            <button *ngIf="authService.can('USERS', 'EDIT')" type="button" class="ghost-button" (click)="edit(user)">
              Editar
            </button>
            <button
              *ngIf="authService.can('USERS', 'DELETE') && user.active"
              type="button"
              class="ghost-button"
              [disabled]="saving()"
              (click)="deactivate(user)"
            >
              Desativar
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <app-list-feedback
      [loading]="list.loading()"
      [error]="list.loadError()"
      [empty]="!list.items().length"
      [filtered]="list.activeCount() > 0"
      [canClear]="list.differsFromDefault()"
      (clear)="list.clear()"
    >
      <p class="empty-state">Nenhum usuário cadastrado</p>
    </app-list-feedback>
  </div>

  <app-pagination [page]="list.page()" [totalPages]="list.totalPages()" (pageChange)="list.goTo($event)" />
</section>
