<header class="page-header">
  <div class="page-heading">
    <h1 class="page-title">Usuários</h1>
    <p class="page-subtitle">Gerencie quem acessa o sistema</p>
  </div>
  <div class="page-actions" *ngIf="authService.can('USERS', 'CREATE')">
    <button type="button" class="primary-button" (click)="create()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14"></path>
      </svg>
      <span>Novo usuário</span>
    </button>
  </div>
</header>

<section class="panel list-panel">
  <app-filter-panel [list]="list" [chips]="chips()">
    <label filterSearch class="input-affix search-field">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5"></circle>
        <path d="M20 20l-4.2-4.2"></path>
      </svg>
      <input
        name="filterName"
        placeholder="Buscar por nome"
        aria-label="Buscar por nome"
        [(ngModel)]="list.filters.name"
        (change)="list.apply()"
        (keydown.enter)="list.apply()"
      />
    </label>

    <label class="filter-field" [class.is-set]="list.applied().email">
      <span>E-mail</span>
      <input
        name="filterEmail"
        [(ngModel)]="list.filters.email"
        (change)="list.apply()"
        (keydown.enter)="list.apply()"
      />
    </label>
    <label class="filter-field" *ngIf="canViewProfiles()" [class.is-set]="list.applied().profileId">
      <span>Perfil</span>
      <select name="filterProfileId" [(ngModel)]="list.filters.profileId" (change)="list.apply()">
        <option value="">Todos</option>
        <option *ngFor="let profile of profiles()" [value]="profile.id">{{ profile.name }}</option>
      </select>
    </label>
    <label class="filter-field" [class.is-set]="list.applied().active">
      <span>Situação</span>
      <select name="filterActive" [(ngModel)]="list.filters.active" (change)="list.apply()">
        <option value="true">Ativos</option>
        <option value="false">Inativos</option>
        <option value="">Todos</option>
      </select>
    </label>
  </app-filter-panel>

  <div class="table-wrap" [attr.aria-busy]="list.loading()">
    <table class="fixed-layout" *ngIf="list.items().length">
      <colgroup>
        <col />
        <col />
        <col class="col-profile" />
        <col class="col-status" />
        <col class="col-actions" />
      </colgroup>
      <thead>
        <tr>
          <th scope="col">Nome</th>
          <th scope="col">E-mail</th>
          <th scope="col">Perfil</th>
          <th scope="col">Status</th>
          <th scope="col"><span class="sr-only">Ações</span></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of list.items()">
          <td class="name-cell" data-label="Nome">{{ user.name }}</td>
          <td data-label="E-mail">{{ user.email }}</td>
          <td data-label="Perfil">{{ profileName(user) }}</td>
          <td data-label="Status">
            <span class="status-pill" [class.pill-income]="user.active" [class.pill-neutral]="!user.active">
              {{ user.active ? 'Ativo' : 'Inativo' }}
            </span>
          </td>
          <td class="row-actions">
            <span class="row-actions-inner">
              <button
                *ngIf="authService.can('USERS', 'EDIT')"
                type="button"
                class="icon-button"
                aria-label="Editar usuário"
                title="Editar usuário"
                (click)="edit(user)"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"></path>
                  <path d="M13.5 6.5l4 4"></path>
                </svg>
              </button>
              <button
                *ngIf="authService.can('USERS', 'DELETE') && user.active"
                type="button"
                class="icon-button danger"
                aria-label="Desativar usuário"
                title="Desativar usuário"
                [disabled]="saving()"
                (click)="deactivate(user)"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="12" cy="12" r="8.5"></circle>
                  <path d="M6 6l12 12"></path>
                </svg>
              </button>
            </span>
          </td>
        </tr>
      </tbody>
    </table>

    <app-list-feedback
      [loading]="list.loading()"
      [error]="list.loadError()"
      [empty]="!list.items().length"
      [filtered]="list.activeCount() > 0"
      [canClear]="list.differsFromDefault()"
      (clear)="list.clear()"
    >
      <div class="list-state">
        <strong>Nenhum usuário cadastrado</strong>
        <p class="empty-state">Os usuários que você cadastrar aparecem aqui.</p>
      </div>
    </app-list-feedback>
  </div>

  <app-pagination
    [page]="list.page()"
    [totalPages]="list.totalPages()"
    [totalItems]="list.totalItems()"
    (pageChange)="list.goTo($event)"
  />
</section>
