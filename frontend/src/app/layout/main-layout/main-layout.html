<main class="app-shell">
  <aside
    class="sidebar"
    [class.expanded]="expanded()"
    (mouseenter)="expand()"
    (mouseleave)="onMouseLeave($event)"
    (focusin)="expand()"
    (focusout)="onFocusOut($event)"
  >
    <div class="brand-block">
      <div class="mark">F</div>
      <div class="brand-text">
        <h1>FinanceOS</h1>
        <p>Controle financeiro</p>
      </div>
    </div>

    <nav class="nav-list" aria-label="Principal">
      <button
        *ngIf="authService.can('DASHBOARD', 'VIEW')"
        type="button"
        routerLink="/dashboard"
        routerLinkActive="active"
        (click)="onNavigate()"
        [attr.title]="expanded() ? null : 'Resumo'"
        [attr.aria-label]="expanded() ? null : 'Resumo'"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="3" y="3" width="7.5" height="7.5" rx="1.6"></rect>
          <rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"></rect>
          <rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"></rect>
          <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"></rect>
        </svg>
        <span class="nav-label">Resumo</span>
      </button>
      <button
        *ngIf="authService.can('TRANSACTIONS', 'VIEW')"
        type="button"
        routerLink="/transactions"
        routerLinkActive="active"
        (click)="onNavigate()"
        [attr.title]="expanded() ? null : 'Lancamentos'"
        [attr.aria-label]="expanded() ? null : 'Lancamentos'"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M4 8h13M17 8l-3.2-3.2M17 8l-3.2 3.2"></path>
          <path d="M20 16H7M7 16l3.2-3.2M7 16l3.2 3.2"></path>
        </svg>
        <span class="nav-label">Lancamentos</span>
      </button>
      <div class="nav-group" *ngIf="canSeeRegisters()">
        <button
          type="button"
          class="nav-parent"
          [class.active]="isRegistersActive()"
          (click)="toggleGroup('registers')"
          [attr.title]="expanded() ? null : 'Cadastros'"
          [attr.aria-label]="expanded() ? null : 'Cadastros'"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M3.5 7a2 2 0 0 1 2-2h4.2l2.1 2.6h6.7a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"></path>
          </svg>
          <span class="nav-label">Cadastros</span>
        </button>
        <div class="nav-children" *ngIf="openGroup() === 'registers' && expanded()">
          <button
            *ngIf="authService.can('CATEGORIES', 'VIEW')"
            type="button"
            routerLink="/categories"
            routerLinkActive="active"
            (click)="onNavigate()"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <circle cx="8.5" cy="12" r="5.2"></circle>
              <circle cx="16" cy="12" r="5.2"></circle>
            </svg>
            <span class="nav-label">Categorias</span>
          </button>
        </div>
      </div>
      <div class="nav-group" *ngIf="canSeeSettings()">
        <button
          type="button"
          class="nav-parent"
          [class.active]="isSettingsActive()"
          (click)="toggleGroup('settings')"
          [attr.title]="expanded() ? null : 'Configuracoes'"
          [attr.aria-label]="expanded() ? null : 'Configuracoes'"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="5" y="3" width="14" height="18" rx="2"></rect>
            <path d="M8.5 8h7M8.5 12h7M8.5 16h4"></path>
          </svg>
          <span class="nav-label">Configuracoes</span>
        </button>
        <div class="nav-children" *ngIf="openGroup() === 'settings' && expanded()">
          <button
            *ngIf="authService.can('USERS', 'VIEW')"
            type="button"
            routerLink="/users"
            routerLinkActive="active"
            (click)="onNavigate()"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <circle cx="12" cy="8" r="3.6"></circle>
              <path d="M4.5 20c0-4.2 3.4-6.8 7.5-6.8s7.5 2.6 7.5 6.8"></path>
            </svg>
            <span class="nav-label">Usuarios</span>
          </button>
          <button
            *ngIf="authService.can('PROFILES', 'VIEW')"
            type="button"
            routerLink="/profiles"
            routerLinkActive="active"
            (click)="onNavigate()"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <rect x="4" y="4" width="16" height="16" rx="4"></rect>
              <path d="M8.5 12.5l2.3 2.3 4.7-4.7"></path>
            </svg>
            <span class="nav-label">Perfis</span>
          </button>
        </div>
      </div>
    </nav>

    <button
      type="button"
      class="logout-button"
      (click)="logout()"
      [attr.title]="expanded() ? null : 'Sair'"
      [attr.aria-label]="expanded() ? null : 'Sair'"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"></path>
        <path d="M11 8l-4 4 4 4"></path>
        <path d="M7 12h11"></path>
      </svg>
      <span class="nav-label">Sair</span>
    </button>

    <footer class="sidebar-footer">
      <p class="current-user" *ngIf="authService.me() as me">{{ me.name }}</p>
      <p class="app-footer">{{ appName }} &middot; v{{ appVersion }}</p>
    </footer>
  </aside>

  <section class="workspace" #workspace tabindex="-1">
    <router-outlet />
  </section>
</main>
