<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Detalhe do lançamento no celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #f6f5f2; color: #1b1a18; font-family: 'Inter', system-ui, sans-serif; font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums">

<div aria-hidden="true" style="padding: 20px 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span style="font-size: 22px; line-height: 1.25; font-weight: 700">Lançamentos</span>
<span style="font-size: 13.5px; color: #6b6760">9 lançamentos</span>
</div>
<div style="height: 48px; background: #ffffff; border: 1px solid #e8e6e1; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">Outubro de 2026</div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600; color: #4a4741">{{g.head}}</span>
<div style="background: #ffffff; border: 1px solid #e8e6e1; border-radius: 16px; display: flex; flex-direction: column">
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
<div style="min-height: 68px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 12px 14px">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #efeeea; flex-shrink: 0"></span>
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 15px; font-weight: 600">{{r.desc}}</span><span style="font-size: 13px; color: #6b6760">{{r.cat}}</span></span>
<span style="font-size: 15px; font-weight: 600">{{r.amount}}</span>
</div>
</sc-for>
</div>
</div>
</sc-for>
</div>

<div style="position: absolute; inset: 0; background: rgba(20,24,40,0.55)"></div>

<section role="dialog" aria-modal="true" aria-labelledby="detalhe-titulo" style="position: absolute; left: 0; right: 0; bottom: 0; background: #ffffff; border-radius: 20px 20px 0 0; box-shadow: 0 -12px 40px rgba(20,24,40,0.25); padding: 10px 16px 28px; display: flex; flex-direction: column; gap: 18px">
<span style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #d6d3cc"></span>

<div style="display: flex; align-items: flex-start; gap: 12px">
<span style="width: 44px; height: 44px; border-radius: 14px; background: #efeeea; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5e5b55" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5.5 12.5L12 19l6.5-6.5"></path></svg>
</span>
<div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
<h2 id="detalhe-titulo" style="margin: 0; font-size: 17px; font-weight: 600; overflow-wrap: anywhere">Internet fibra</h2>
<strong style="font-size: 28px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em">− R$ 119,90</strong>
</div>
<a href="Lancamentos-celular.dc.html" aria-label="Fechar" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #4a4741; flex-shrink: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
</div>

<dl style="margin: 0; display: flex; flex-direction: column; border: 1px solid #e8e6e1; border-radius: 14px">
<div style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px">
<dt style="font-size: 13.5px; color: #6b6760">Tipo</dt>
<dd style="margin: 0; font-size: 14.5px; font-weight: 500">Despesa</dd>
</div>
<div style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-top: 1px solid #e8e6e1">
<dt style="font-size: 13.5px; color: #6b6760">Categoria</dt>
<dd style="margin: 0; font-size: 14.5px; font-weight: 500; display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 999px; background: #5b6fd6"></span>Moradia</dd>
</div>
<div style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-top: 1px solid #e8e6e1">
<dt style="font-size: 13.5px; color: #6b6760">Data</dt>
<dd style="margin: 0; font-size: 14.5px; font-weight: 500">05/10/2026</dd>
</div>
<div style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-top: 1px solid #e8e6e1">
<dt style="font-size: 13.5px; color: #6b6760">Status</dt>
<dd style="margin: 0"><span style="height: 24px; padding: 0 10px; border-radius: 999px; background: #fcf1de; color: #8f5507; font-size: 12.5px; font-weight: 600; display: flex; align-items: center">Pendente</span></dd>
</div>
</dl>

<div style="display: flex; flex-direction: column; gap: 10px">
<a href="Novo-lancamento-celular.dc.html" style="height: 52px; border-radius: 14px; background: #3b5bdb; color: #ffffff; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path></svg>
Editar lançamento
</a>
<button type="button" style="height: 48px; border: 0; border-radius: 14px; background: #fbecea; color: #b93a2e; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M9.5 7V5h5v2M7 7l1 12.5h8L17 7"></path></svg>
Excluir lançamento
</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { groups: [
{ head: 'Sábado, 10 de outubro', rows: [{ desc: 'Condomínio', cat: 'Moradia', amount: '− R$ 480,00' }, { desc: 'Energia elétrica', cat: 'Moradia', amount: '− R$ 212,60' }] },
{ head: 'Segunda, 5 de outubro', rows: [{ desc: 'Internet fibra', cat: 'Moradia', amount: '− R$ 119,90' }, { desc: 'Academia', cat: 'Saúde', amount: '− R$ 129,00' }] }
] };
}
}
</script>
</body>
</html>
