<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lançamentos no celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1400px; box-sizing: border-box; background: #f6f5f2; color: #1b1a18; font-family: 'Inter', system-ui, sans-serif; font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums; display: flex; flex-direction: column">
<div style="padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 14px">

<header style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
<h1 style="margin: 0; font-size: 22px; line-height: 1.25; font-weight: 700">Lançamentos</h1>
<span style="font-size: 13.5px; color: #6b6760">9 lançamentos</span>
</header>

<div role="group" aria-label="Período" style="display: flex; align-items: center; justify-content: space-between; height: 48px; background: #ffffff; border: 1px solid #e8e6e1; border-radius: 14px; padding: 0 2px">
<button type="button" aria-label="Mês anterior" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #4a4741">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</button>
<button type="button" style="flex-grow: 1; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b6760" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" rx="2.5"></rect><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"></path></svg>
<span>Outubro de 2026</span>
</button>
<button type="button" aria-label="Próximo mês" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #4a4741">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>
</div>

<div style="display: flex; gap: 8px">
<label style="flex-grow: 1; min-width: 0; height: 48px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; background: #ffffff; border: 1px solid #938f87; border-radius: 12px; padding: 0 12px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b6760" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4-4"></path></svg>
<input type="search" aria-label="Buscar por descrição" placeholder="Buscar por descrição" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 16px; color: #1b1a18">
</label>
<a href="Filtros-celular.dc.html" aria-label="Filtros, 1 ativo" style="position: relative; height: 48px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; background: #ffffff; border: 1px solid #d6d3cc; border-radius: 12px; padding: 0 14px; font-size: 14px; font-weight: 600">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
Filtros
<span style="min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 6px; border-radius: 999px; background: #3b5bdb; color: #ffffff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">1</span>
</a>
</div>

<div role="group" aria-label="Tipo" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: #efeeea; border-radius: 12px; padding: 4px">
<button type="button" aria-pressed="true" style="height: 40px; border: 0; border-radius: 9px; font-size: 14px; font-weight: 600; background: #ffffff; box-shadow: 0 1px 2px rgba(27,26,24,0.12)">Todos</button>
<button type="button" aria-pressed="false" style="height: 40px; border: 0; border-radius: 9px; font-size: 14px; font-weight: 600; background: transparent; color: #4a4741">Despesas</button>
<button type="button" aria-pressed="false" style="height: 40px; border: 0; border-radius: 9px; font-size: 14px; font-weight: 600; background: transparent; color: #4a4741">Receitas</button>
</div>

<div style="display: flex; flex-direction: column; gap: 16px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; padding: 0 2px; font-size: 13px; font-weight: 600; color: #4a4741">{{g.head}}</h2>
<div style="background: #ffffff; border: 1px solid #e8e6e1; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
<a href="Detalhe-celular.dc.html" style="min-height: 68px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: {{r.border}}">
<span style="width: 40px; height: 40px; border-radius: 12px; background: {{r.iconBg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{r.iconStroke}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg>
</span>
<span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
<span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.desc}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6b6760">
<span style="width: 8px; height: 8px; border-radius: 999px; background: {{r.color}}; flex-shrink: 0"></span>
{{r.cat}}
</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0">
<span style="font-size: 15px; font-weight: 600; color: {{r.amtColor}}">{{r.amount}}</span>
<sc-if value="{{r.pending}}" hint-placeholder-val="{{true}}">
<span style="height: 22px; padding: 0 8px; border-radius: 999px; background: #fcf1de; color: #8f5507; font-size: 12px; font-weight: 600; display: flex; align-items: center">Pendente</span>
</sc-if>
<sc-if value="{{r.paid}}" hint-placeholder-val="{{false}}">
<span style="font-size: 12.5px; color: #6b6760">Pago</span>
</sc-if>
</span>
</a>
</sc-for>
</div>
</section>
</sc-for>
</div>

<nav aria-label="Paginação" style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<button type="button" disabled style="height: 44px; padding: 0 14px; border: 1px solid #e8e6e1; border-radius: 12px; background: #faf9f7; font-size: 14px; font-weight: 600; color: #8e8a83">Anterior</button>
<span style="font-size: 13.5px; color: #4a4741">Página 1 de 1</span>
<button type="button" disabled style="height: 44px; padding: 0 14px; border: 1px solid #e8e6e1; border-radius: 12px; background: #faf9f7; font-size: 14px; font-weight: 600; color: #8e8a83">Próxima</button>
</nav>
</div>

<nav aria-label="Navegação principal" style="margin-top: auto; height: 76px; box-sizing: border-box; background: #ffffff; border-top: 1px solid #e8e6e1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; padding: 0 8px">
<a href="Main.dc.html" style="height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #4a4741; font-size: 12px; font-weight: 500">
<span style="width: 52px; height: 30px; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"></rect><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"></rect><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"></rect><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"></rect></svg>
</span>
Resumo
</a>
<a href="Lancamentos-celular.dc.html" aria-current="page" style="height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #2b44b0; font-size: 12px; font-weight: 700">
<span style="width: 52px; height: 30px; border-radius: 999px; background: #edf1fd; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13M17 8l-3.2-3.2M17 8l-3.2 3.2"></path><path d="M20 16H7M7 16l3.2-3.2M7 16l3.2 3.2"></path></svg>
</span>
Lançamentos
</a>
<a href="Novo-lancamento-celular.dc.html" aria-label="Novo lançamento" style="height: 60px; display: flex; align-items: center; justify-content: center">
<span style="width: 52px; height: 52px; border-radius: 999px; background: #3b5bdb; color: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(59,91,219,0.35)">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</span>
</a>
<button type="button" style="height: 60px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #4a4741; font-size: 12px; font-weight: 500">
<span style="width: 52px; height: 30px; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="19" cy="12" r="1.7"></circle></svg>
</span>
Mais
</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1400}}'>
class Component extends DCLogic {
renderVals() {
var DOWN = 'M12 5v14M5.5 12.5L12 19l6.5-6.5', UP = 'M12 19V5M5.5 11.5L12 5l6.5 6.5';
function row(desc, cat, color, amount, status, first) {
var income = status === 'INCOME';
return { desc: desc, cat: cat, color: color, amount: (income ? '+ ' : '− ') + 'R$ ' + amount, amtColor: income ? '#177245' : '#1b1a18', iconBg: income ? '#e6f4ec' : '#efeeea', iconStroke: income ? '#177245' : '#5e5b55', icon: income ? UP : DOWN, pending: status === 'PENDING', paid: status === 'PAID', border: first ? '0' : '1px solid #e8e6e1' };
}
return { groups: [
{ head: 'Sábado, 10 de outubro', rows: [row('Condomínio', 'Moradia', '#5b6fd6', '480,00', 'PENDING', true), row('Energia elétrica', 'Moradia', '#5b6fd6', '212,60', 'PENDING')] },
{ head: 'Segunda, 5 de outubro', rows: [row('Internet fibra', 'Moradia', '#5b6fd6', '119,90', 'PENDING', true), row('Academia', 'Saúde', '#c2478a', '129,00', 'PENDING')] },
{ head: 'Hoje, 3 de outubro', rows: [row('Feira da semana', 'Mercado', '#2f7d62', '184,90', 'PAID', true), row('Uber para o centro', 'Transporte', '#d9951f', '27,40', 'PAID')] },
{ head: 'Ontem, 2 de outubro', rows: [row('Farmácia', 'Saúde', '#c2478a', '96,00', 'PAID', true)] },
{ head: 'Quinta, 1 de outubro', rows: [row('Salário', 'Salário', '#35a56c', '7.200,00', 'INCOME', true), row('Aluguel', 'Moradia', '#5b6fd6', '1.800,00', 'PAID')] }
] };
}
}
</script>
</body>
</html>
